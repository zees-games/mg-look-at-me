# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One case: the client bench has no map switch (the game's levels are inside its house), so "lobby" is the real client in the lobby against the real server.
PERF_CASES=lobby
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a level of the house; the shots are tools/shot.sh views.
VISUAL_CASES="level1 level3"
VISUAL_SHOTS="eyes third"

visual_render() {
    for shot in $VISUAL_SHOTS; do
        heavy -- timeout 300 tools/shot.sh --view="$shot" --level="${1#level}" --out="res://screenshots/${1}_${shot}.png" || return 1
    done
}
